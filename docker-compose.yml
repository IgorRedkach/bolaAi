# BOLA AI — Quick start for users.
# Uses the pre-built image from ghcr.io (no local build needed).
#
#   First run (needs internet):
#     OLLAMA_ONLINE_SETUP=1 docker compose up -d
#
#   After that (fully offline):
#     docker compose up -d
#
#   Open http://localhost:8000/chat and type "help".
#
services:
  ollama:
    image: ollama/ollama:latest
    container_name: bola-ollama
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        if [ "$${OLLAMA_ONLINE_SETUP:-0}" = "1" ]; then
          ollama serve &
          sleep 5
          if ! ollama list 2>/dev/null | grep -q bola-analyzer; then
            echo "Creating bola-analyzer model (one-time download)..."
            ollama pull qwen2.5-coder:7b && ollama create bola-analyzer -f /Modelfile
          fi
          wait
        else
          echo "Offline mode: starting Ollama (model must be in volume)."
          exec ollama serve
        fi
    environment:
      - OLLAMA_ONLINE_SETUP=${OLLAMA_ONLINE_SETUP:-0}
    volumes:
      - ollama_data:/root/.ollama
      - ./docker/Modelfile:/Modelfile:ro
    ports:
      - "11434:11434"
    healthcheck:
      test: ["CMD-SHELL", "ollama list 2>/dev/null | grep -q bola-analyzer || exit 1"]
      interval: 15s
      timeout: 45s
      retries: 40
      start_period: 600s

  bola-ai:
    image: ghcr.io/igorredkach/bolai:latest
    container_name: bola-ai
    ports:
      - "8000:8000"
    environment:
      BOLA_AI_DATA: /data
      OLLAMA_HOST: http://ollama:11434
      OLLAMA_MODEL: bola-analyzer
      BOLA_AI_NUM_THREAD: ${BOLA_AI_NUM_THREAD:-8}
      BOLA_AI_OLLAMA_NUM_CTX: ${BOLA_AI_OLLAMA_NUM_CTX:-8192}
      BOLA_AI_OLLAMA_NUM_PREDICT: ${BOLA_AI_OLLAMA_NUM_PREDICT:-768}
      BOLA_AI_N_CONTEXT: ${BOLA_AI_N_CONTEXT:-12}
      BOLA_AI_MAX_CONTEXT_CHARS: ${BOLA_AI_MAX_CONTEXT_CHARS:-12000}
      BOLA_AI_AUTO_ANALYZE_ON_STARTUP: ${BOLA_AI_AUTO_ANALYZE_ON_STARTUP:-1}
      BOLA_AI_PRELOAD: "1"
      BOLA_AI_LOG_LEVEL: "INFO"
    volumes:
      - app_data:/data
      - ./shared_docs:/shared-docs
    depends_on:
      ollama:
        condition: service_healthy

volumes:
  ollama_data:
  app_data:
