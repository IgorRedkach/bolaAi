# BOLA AI — start the pre-built all-in-one image.
# Models, RAG knowledge, and the embedding model are all baked into the image.
# No internet required after docker pull.
#
#   docker compose up -d
#   open http://localhost:8000/chat
#
services:
  bola-ai:
    image: ghcr.io/igorredkach/bolai:latest
    container_name: bola-ai
    ports:
      - "8000:8000"
    environment:
      BOLA_AI_N_CONTEXT: ${BOLA_AI_N_CONTEXT:-12}
      BOLA_AI_MAX_CONTEXT_CHARS: ${BOLA_AI_MAX_CONTEXT_CHARS:-12000}
      BOLA_AI_AUTO_ANALYZE_ON_STARTUP: ${BOLA_AI_AUTO_ANALYZE_ON_STARTUP:-1}
      BOLA_AI_LOG_LEVEL: "INFO"
    volumes:
      - ./shared_docs:/shared-docs
      - chroma_data:/data/chroma

volumes:
  chroma_data:   # ChromaDB — wipe between sessions for clean state: docker compose down -v
