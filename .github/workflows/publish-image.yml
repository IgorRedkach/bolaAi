name: Build and publish BOLA AI image

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'data/**'
      - 'docker/**'
      - 'models/**'
      - 'pyproject.toml'
      - '.github/workflows/**'
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: igorredkach/bolai

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout (with LFS for model weights)
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Free disk space (CI image build)
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL 2>/dev/null || true
          df -h

      - name: Verify bola-har model weights present
        run: |
          ls -lh models/merged/bola-har-merged/
          test -f models/merged/bola-har-merged/model.safetensors || (echo "ERROR: model.safetensors missing from LFS" && exit 1)

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,prefix=

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile.allinone
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
