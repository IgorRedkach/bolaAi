run_name: qlora_cpu_3b_full
mode: qlora
# 3B model full CPU training. User accepts multi-day runtime.
# Memory budget on CPU float32 with gradient_checkpointing:
#   - model weights: ~12GB
#   - checkpointed activations (seq=256): ~600MB
#   - LoRA adapter + optimizer: ~400MB
#   - Total: ~13GB → fits in 16GB available
# Expected time: 30-120 min/step on 12-thread CPU → 300 steps = 4-25 days
# (User explicitly accepted "no matter how long it will take")
base_model: Qwen/Qwen2.5-Coder-3B-Instruct
dataset:
  sft_train: data/training/sft/train.jsonl
  sft_valid: data/training/sft/valid.jsonl
quantization:
  load_in_4bit: false   # bitsandbytes 4-bit is CUDA-only; CPU uses float32
  quant_type: nf4
  compute_dtype: float32
precision:
  dtype: float32        # CPU training must use float32
lora:
  r: 16                 # Higher rank = more expressive, worth it for 3B
  alpha: 32
  dropout: 0.05
  target_modules:
    - q_proj
    - k_proj
    - v_proj
    - o_proj
    - gate_proj
    - up_proj
    - down_proj
training:
  per_device_train_batch_size: 1
  gradient_accumulation_steps: 8
  learning_rate: 0.0002
  num_train_epochs: 10   # 10 epochs to properly teach the 37 examples
  max_steps: 0           # 0 = run to completion (all epochs)
  gradient_checkpointing: true   # CRITICAL for 3B on CPU: reduces activation RAM from 3GB to 600MB
  optimizer: adamw_torch         # paged_adamw_8bit is CUDA-only
  max_seq_length: 256    # Short window to reduce activation memory
  sample_packing: false
outputs:
  adapters_dir: models/adapters
  merged_dir: models/merged
