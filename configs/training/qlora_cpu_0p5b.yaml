run_name: qlora_cpu_0p5b
mode: qlora
# 0.5B model is the only model feasible for CPU-only LoRA fine-tuning.
# On a modern CPU (16-32 threads), expect ~10-30 s/step with 256-token sequences.
# Total estimated time: 50-100 steps × ~20 s = ~17-33 minutes.
base_model: Qwen/Qwen2.5-Coder-0.5B-Instruct
dataset:
  sft_train: data/training/sft/train.jsonl
  sft_valid: data/training/sft/valid.jsonl
quantization:
  load_in_4bit: false   # bitsandbytes 4-bit is CUDA-only; CPU uses float32
  quant_type: nf4
  compute_dtype: float32
precision:
  dtype: float32        # CPU must use float32 (not bfloat16/float16)
lora:
  r: 8
  alpha: 16
  dropout: 0.05
  target_modules:
    - q_proj
    - k_proj
    - v_proj
    - o_proj
training:
  per_device_train_batch_size: 1
  gradient_accumulation_steps: 4
  learning_rate: 0.0003
  num_train_epochs: 3
  max_steps: 60          # Hard cap: 60 steps × ~20 s ≈ 20 min on CPU
  gradient_checkpointing: false  # CPU: gradient_checkpointing with CUDA fp16 hooks causes errors
  optimizer: adamw_torch         # paged_adamw_8bit is CUDA-only
  max_seq_length: 512    # Short sequences critical for CPU feasibility
  sample_packing: false  # Keep simple for CPU mode
outputs:
  adapters_dir: models/adapters
  merged_dir: models/merged
