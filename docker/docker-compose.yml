# BOLA AI — DEVELOPMENT compose (builds from local source).
# For end users: use the root docker-compose.yml instead (pulls pre-built image from ghcr.io).
# Default: OFFLINE — no internet. Ollama just runs serve; model must already be in ollama_data volume (see docs/OFFLINE_DEPLOY.md).
# Optional: set OLLAMA_ONLINE_SETUP=1 to pull/create model once (uses internet); then remove it and run offline.
services:
  ollama:
    image: ollama/ollama:latest
    container_name: bola-ollama
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        if [ "$${OLLAMA_ONLINE_SETUP:-0}" = "1" ]; then
          ollama serve &
          sleep 5
          if ! ollama list 2>/dev/null | grep -q bola-analyzer; then
            echo "Creating bola-analyzer (uses internet, one-time)..."
            ollama pull qwen2.5-coder:7b && ollama create bola-analyzer -f /Modelfile
          fi
          wait
        else
          echo "Offline mode: starting Ollama (model must be in volume)."
          exec ollama serve
        fi
    environment:
      - OLLAMA_ONLINE_SETUP=${OLLAMA_ONLINE_SETUP:-0}
    volumes:
      - ollama_data:/root/.ollama
      - ./Modelfile:/Modelfile:ro
    ports:
      - "11434:11434"
    healthcheck:
      test: ["CMD-SHELL", "ollama list 2>/dev/null | grep -q bola-analyzer || exit 1"]
      interval: 15s
      timeout: 45s
      retries: 40
      start_period: 600s

  bola-ai:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: bola-ai
    ports:
      - "8000:8000"
    environment:
      BOLA_AI_DATA: /data
      OLLAMA_HOST: http://ollama:11434
      OLLAMA_MODEL: bola-analyzer
      BOLA_AI_NUM_THREAD: "${BOLA_AI_NUM_THREAD:-8}"
      BOLA_AI_OLLAMA_NUM_CTX: "${BOLA_AI_OLLAMA_NUM_CTX:-8192}"
      BOLA_AI_OLLAMA_NUM_PREDICT: "${BOLA_AI_OLLAMA_NUM_PREDICT:-768}"
      BOLA_AI_N_CONTEXT: "${BOLA_AI_N_CONTEXT:-12}"
      BOLA_AI_MAX_CONTEXT_CHARS: "${BOLA_AI_MAX_CONTEXT_CHARS:-12000}"
      BOLA_AI_AUTO_ANALYZE_ON_STARTUP: "${BOLA_AI_AUTO_ANALYZE_ON_STARTUP:-1}"
      BOLA_AI_AUTO_ANALYZE_TIMEOUT: "${BOLA_AI_AUTO_ANALYZE_TIMEOUT:-420}"
      BOLA_AI_AUTO_ANALYZE_N_CONTEXT: "${BOLA_AI_AUTO_ANALYZE_N_CONTEXT:-8}"
      BOLA_AI_AUTO_ANALYZE_MAX_SOURCES: "${BOLA_AI_AUTO_ANALYZE_MAX_SOURCES:-2}"
      # Set to "0" to skip RAG preload on first start (if low RAM)
      BOLA_AI_PRELOAD: "1"
      # DEBUG for more logs
      BOLA_AI_LOG_LEVEL: "INFO"
    volumes:
      - app_data:/data
      - ../shared_docs:/shared-docs
      # Mount local src for latest code (e.g. logging) without rebuilding
      - ../src:/app/src:ro
    depends_on:
      ollama:
        condition: service_healthy

volumes:
  ollama_data:   # Model cache; wipe if you want to remove models
  app_data:      # Chroma + ephemeral data; wipe after analysis
