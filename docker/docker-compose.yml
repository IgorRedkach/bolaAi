# BOLA AI — DEVELOPMENT compose (builds from local source + src bind-mount).
# For end users: use the root docker-compose.yml (pre-built all-in-one image).
#
# Prerequisites: Ollama must have the bola-analyzer model in the named volume.
#   ollama pull qwen2.5-coder:3b
#   ollama create bola-analyzer -f docker/Modelfile
#
services:
  ollama:
    image: ollama/ollama:latest
    container_name: bola-ollama
    command: serve
    volumes:
      - ollama_data:/root/.ollama
    ports:
      - "11434:11434"
    healthcheck:
      test: ["CMD-SHELL", "ollama list 2>/dev/null | grep -q bola-analyzer || exit 1"]
      interval: 15s
      timeout: 45s
      retries: 40
      start_period: 600s

  bola-ai:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: bola-ai
    ports:
      - "8000:8000"
    environment:
      BOLA_AI_DATA: /data
      OLLAMA_HOST: http://ollama:11434
      OLLAMA_MODEL: bola-analyzer
      BOLA_AI_NUM_THREAD: "${BOLA_AI_NUM_THREAD:-8}"
      BOLA_AI_OLLAMA_NUM_CTX: "${BOLA_AI_OLLAMA_NUM_CTX:-8192}"
      BOLA_AI_OLLAMA_NUM_PREDICT: "${BOLA_AI_OLLAMA_NUM_PREDICT:-768}"
      BOLA_AI_N_CONTEXT: "${BOLA_AI_N_CONTEXT:-12}"
      BOLA_AI_MAX_CONTEXT_CHARS: "${BOLA_AI_MAX_CONTEXT_CHARS:-12000}"
      BOLA_AI_AUTO_ANALYZE_ON_STARTUP: "${BOLA_AI_AUTO_ANALYZE_ON_STARTUP:-1}"
      BOLA_AI_AUTO_ANALYZE_TIMEOUT: "${BOLA_AI_AUTO_ANALYZE_TIMEOUT:-420}"
      BOLA_AI_AUTO_ANALYZE_N_CONTEXT: "${BOLA_AI_AUTO_ANALYZE_N_CONTEXT:-8}"
      BOLA_AI_AUTO_ANALYZE_MAX_SOURCES: "${BOLA_AI_AUTO_ANALYZE_MAX_SOURCES:-2}"
      BOLA_AI_PRELOAD: "1"
      BOLA_AI_LOG_LEVEL: "INFO"
    volumes:
      - app_data:/data
      - ../shared_docs:/shared-docs
      - ../src:/app/src:ro
    depends_on:
      ollama:
        condition: service_healthy

volumes:
  ollama_data:   # Ollama model cache
  app_data:      # ChromaDB — wipe after analysis: docker compose down -v
