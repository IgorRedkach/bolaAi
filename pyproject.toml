[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "bola-ai"
version = "0.1.0"
description = "Local AI agent to find BOLA (Broken Object-Level Authorization) vulnerabilities"
readme = "README.md"
license = { text = "GPL-3.0-or-later" }
requires-python = ">=3.10"
authors = [{ name = "bolaAi" }]
dependencies = [
    "fastapi>=0.109.0",
    "uvicorn[standard]>=0.27.0",
    "httpx>=0.26.0",
    "pydantic>=2.5.0",
    "chromadb>=0.4.22",
    "sentence-transformers>=2.2.2",
    "python-multipart>=0.0.6",
    "jinja2>=3.1.0",
    "pyyaml>=6.0",
    "sqlparse>=0.5.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=4.1.0",
]
train = [
    "transformers>=4.44.0",
    "datasets>=2.20.0",
    "peft>=0.12.0",
    "trl>=0.9.6",
    "accelerate>=0.33.0",
    "bitsandbytes>=0.43.0",
]

[project.scripts]
bola-ai = "bola_ai.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["src"]

[tool.coverage.run]
source = ["src"]
branch = true

[tool.coverage.report]
exclude_lines = ["pragma: no cover", "def __repr__"]
